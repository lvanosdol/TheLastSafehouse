<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<title>Finch holographic interface concept</title><desc>A cinematic translucent boss interface with central terminal, floating binary module and collapsible utility rail.</desc>
<defs><radialGradient id="bg"><stop stop-color="#192c50"/><stop offset="1" stop-color="#080b19"/></radialGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#193456" stop-opacity=".88"/><stop offset="1" stop-color="#11162d" stop-opacity=".86"/></linearGradient><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#dceeff}.mono{font-family:Consolas,monospace}.dim{fill:#8197b9}.cyan{fill:#70e4ff}.pink{fill:#d2a5ff}.tiny{font-size:12px;letter-spacing:1.8px}.glass{fill:url(#glass);stroke:#46739b;stroke-width:1.3}.input{fill:#0b1730;stroke:#668ab6}</style></defs>
<rect width="1400" height="900" fill="url(#bg)"/><g stroke="#6ab7e8" stroke-opacity=".055"><path d="M0 100h1400M0 200h1400M0 300h1400M0 400h1400M0 500h1400M0 600h1400M0 700h1400M0 800h1400"/><path d="M100 0v900M300 0v900M500 0v900M700 0v900M900 0v900M1100 0v900M1300 0v900"/></g>
<circle cx="61" cy="54" r="27" fill="#163653" stroke="#70e4ff" stroke-width="2"/><path d="M46 57l8-14 8 14 8-14 8 14" fill="none" stroke="#70e4ff" stroke-width="2"/><text x="104" y="43" class="tiny cyan">FINCH // RECOVERY LINK</text><text x="104" y="70" font-size="23" font-weight="600">Auxiliary Monitor</text><text x="515" y="58" class="dim" font-size="15">“Plenty of time. A carefully measured amount of plenty.”</text>
<text x="1120" y="40" class="tiny dim">POWER RESERVE</text><text x="1120" y="68" class="mono cyan" font-size="22">18:42</text><rect x="1215" y="53" width="140" height="5" rx="2" fill="#263c5b"/><rect x="1215" y="53" width="52" height="5" rx="2" fill="#70e4ff"/>
<rect x="445" y="119" width="899" height="666" rx="18" class="glass"/><text x="478" y="158" class="tiny cyan">RECOVERY TERMINAL</text><text x="1170" y="158" class="tiny dim">WORKSHOP_MONITOR.PY</text><rect x="472" y="181" width="844" height="434" rx="10" fill="#090f20" stroke="#304d72"/>
<g class="mono" font-size="18"><text x="500" y="219" class="dim">01</text><text x="542" y="219"><tspan class="pink">LOCATION</tspan> = <tspan fill="#f0d39b">"Workshop"</tspan></text><text x="500" y="254" class="dim">02</text><text x="542" y="254">LOW_BATTERY_LIMIT = <tspan fill="#ffad9c">20</tspan></text><text x="500" y="289" class="dim">03</text><text x="542" y="289">readings = [<tspan fill="#ffad9c">60, 20, 15, 55</tspan>]</text><text x="500" y="342" class="dim">04</text><text x="542" y="342"><tspan class="cyan">def</tspan> <tspan fill="#8df0c5">battery_status</tspan>(reading):</text><text x="500" y="377" class="dim">05</text><text x="542" y="377">    <tspan class="cyan">if</tspan> reading &lt;= LOW_BATTERY_LIMIT:</text><text x="500" y="412" class="dim">06</text><text x="542" y="412">        <tspan class="cyan">return</tspan> <tspan fill="#f0d39b">"WARNING"</tspan></text><text x="500" y="447" class="dim">07</text><text x="542" y="447">    <tspan class="cyan">return</tspan> <tspan fill="#f0d39b">"OK"</tspan></text><text x="500" y="500" class="dim">08</text><text x="542" y="500"><tspan class="cyan">for</tspan> reading <tspan class="cyan">in</tspan> readings:</text><text x="500" y="535" class="dim">09</text><text x="542" y="535">    print(reading, battery_status(reading))</text></g>
<rect x="472" y="635" width="590" height="119" rx="10" fill="#0a1429" stroke="#304d72"/><text x="496" y="665" class="tiny dim">LIVE OUTPUT</text><text x="496" y="699" class="mono dim" font-size="16">No output yet. Execute when ready.</text><text x="496" y="733" class="mono" font-size="15" fill="#4f6d91">4 tests queued _</text><rect x="1084" y="670" width="232" height="84" rx="42" fill="#63dfff"/><path d="M1120 695l18 16-18 16z" fill="#092039"/><text x="1153" y="719" font-size="21" font-weight="800" fill="#092039">EXECUTE</text>
<rect x="38" y="155" width="373" height="570" rx="18" class="glass"/><text x="65" y="193" class="tiny cyan">BINARY SIGNAL DECODER</text><text x="65" y="220" class="dim" font-size="14">Tap a digit’s field to enter its value.</text>
