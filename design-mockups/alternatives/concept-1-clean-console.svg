<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<title>Clean training console concept</title><desc>Bright spacious boss interface with terminal above a binary identification tray.</desc>
<defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#173042}.m{font-family:Consolas,monospace}.muted{fill:#607687}.white{fill:white}.tiny{font-size:12px;letter-spacing:1px}.card{fill:white;stroke:#cedce4;stroke-width:1.5}.input{fill:#f8fbfc;stroke:#94adbb;stroke-width:1.5}text.m{fill:#d8e8ef}text.m.muted{fill:#607687}</style></defs>
<rect width="1400" height="900" fill="#edf3f6"/><rect width="1400" height="82" fill="#fff" stroke="#d4e0e6"/>
<rect x="30" y="23" width="37" height="37" rx="9" fill="#173e57"/><text x="42" y="49" font-size="21" class="white">S7</text><text x="82" y="37" font-size="13" font-weight="700" fill="#36708e">THE LAST SAFEHOUSE</text><text x="82" y="59" font-size="20" font-weight="700">The Auxiliary Monitor</text><text x="510" y="49" class="muted" font-size="15">Chapter 2 Boss</text>
<rect x="1090" y="20" width="275" height="43" rx="21" fill="#fff7e5" stroke="#e2c06a"/><text x="1110" y="47" font-size="16" fill="#815c12">◷ 18:42 until safe mode · 37%</text>
<rect x="30" y="104" width="1340" height="44" rx="9" fill="#dfeaf0"/><text x="52" y="132" font-size="15">Restore the monitor, run the tests, and stabilize backup power.</text>
<g font-size="14" font-weight="600"><rect x="1005" y="111" width="103" height="30" rx="6" fill="#fff"/><text x="1025" y="132">? Hint</text><rect x="1118" y="111" width="118" height="30" rx="6" fill="#fff"/><text x="1135" y="132">Ⓜ Ask Mara</text><rect x="1246" y="111" width="110" height="30" rx="6" fill="#fff7d6"/><text x="1263" y="132">▤ Notes −</text></g>
<rect x="30" y="168" width="882" height="442" rx="12" class="card"/><text x="53" y="200" class="tiny" font-weight="700" fill="#36708e">MONITOR PROGRAM</text><text x="806" y="200" class="tiny muted">PYTHON</text>
<rect x="50" y="218" width="842" height="284" rx="8" fill="#132431"/>
<g class="m" font-size="17" fill="#d8e8ef"><text x="75" y="250" fill="#6f8b9b">01</text><text x="115" y="250"><tspan fill="#caa6ff">LOCATION</tspan> = <tspan fill="#f5d395">"Workshop"</tspan></text><text x="75" y="280" fill="#6f8b9b">02</text><text x="115" y="280">LOW_BATTERY_LIMIT = <tspan fill="#ffab91">20</tspan></text><text x="75" y="310" fill="#6f8b9b">03</text><text x="115" y="310">battery_readings = [<tspan fill="#ffab91">60, 20, 15, 55</tspan>]</text><text x="75" y="355" fill="#6f8b9b">04</text><text x="115" y="355"><tspan fill="#8fc7ff">def</tspan> <tspan fill="#74e2bd">get_battery_status</tspan>(reading):</text><text x="75" y="385" fill="#6f8b9b">05</text><text x="115" y="385">    <tspan fill="#8fc7ff">if</tspan> reading &lt;= LOW_BATTERY_LIMIT:</text><text x="75" y="415" fill="#6f8b9b">06</text><text x="115" y="415">        status = <tspan fill="#f5d395">"WARNING"</tspan></text><text x="75" y="445" fill="#6f8b9b">07</text><text x="115" y="445">    <tspan fill="#8fc7ff">else</tspan>: status = <tspan fill="#f5d395">"OK"</tspan></text><text x="75" y="475" fill="#6f8b9b">08</text><text x="115" y="475">    <tspan fill="#74e2bd">return</tspan> status</text></g>
<rect x="50" y="518" width="620" height="68" rx="8" fill="#f4f8fa"/><text x="69" y="544" class="tiny muted">OUTPUT</text><text x="69" y="570" class="m muted" font-size="14">Run the program to inspect the battery report.</text><rect x="700" y="528" width="190" height="51" rx="8" fill="#087f5b"/><path d="M725 543l13 10-13 10z" fill="white"/><text x="750" y="560" class="white" font-size="17" font-weight="700">Run Code</text>
<rect x="934" y="168" width="436" height="442" rx="12" class="card"/><text x="958" y="201" class="tiny" font-weight="700" fill="#36708e">DEVICE WORDS</text><text x="958" y="227" class="muted" font-size="14">Match these to the binary signals below.</text>
<g font-size="16"><rect x="958" y="252" width="388" height="58" rx="8" fill="#eaf4f8"/><text x="980" y="287">Backup Battery Monitor</text><rect x="958" y="326" width="388" height="58" rx="8" fill="#eaf4f8"/><text x="980" y="361">Workshop Temperature Sensor</text><rect x="958" y="400" width="388" height="58" rx="8" fill="#eaf4f8"/><text x="980" y="435">Workshop Door Sensor</text></g>
<rect x="958" y="485" width="388" height="98" rx="8" fill="#fff9d9" stroke="#e1d28b"/><text x="978" y="512" class="tiny" fill="#8a7427">STICKY NOTE</text><text x="978" y="540" class="m" font-size="15">Low = reading &lt;= 20</text><text x="978" y="565" class="m" font-size="15">Test OK and WARNING.</text>
<rect x="30" y="632" width="1340" height="235" rx="12" class="card"/><text x="53" y="664" class="tiny" font-weight="700" fill="#36708e">BINARY IDENTIFICATION · TYPE THE VALUE OF EACH BIT</text>
<g class="m" text-anchor="middle"><g><text x="78" y="700" font-size="13" text-anchor="start">SIGNAL A</text><g font-size="18"><text x="102" y="735">0</text><text x="148" y="735">0</text><text x="194" y="735">1</text><text x="240" y="735">0</text><text x="286" y="735">0</text><text x="332" y="735">1</text><text x="378" y="735">0</text><text x="424" y="735">1</text></g><g><rect x="85" y="750" width="34" height="34" class="input"/><rect x="131" y="750" width="34" height="34" class="input"/><rect x="177" y="750" width="34" height="34" class="input"/><rect x="223" y="750" width="34" height="34" class="input"/><rect x="269" y="750" width="34" height="34" class="input"/><rect x="315" y="750" width="34" height="34" class="input"/><rect x="361" y="750" width="34" height="34" class="input"/><rect x="407" y="750" width="34" height="34" class="input"/></g><rect x="120" y="806" width="90" height="31" rx="5" class="input"/><text x="230" y="827" font-size="13" class="muted">decimal ID</text></g>
<g transform="translate(445 0)"><text x="78" y="700" font-size="13" text-anchor="start">SIGNAL B</text><g font-size="18"><text x="102" y="735">0</text><text x="148" y="735">0</text><text x="194" y="735">0</text><text x="240" y="735">0</text><text x="286" y="735">1</text><text x="332" y="735">1</text><text x="378" y="735">1</text><text x="424" y="735">1</text></g><g><rect x="85" y="750" width="34" height="34" class="input"/><rect x="131" y="750" width="34" height="34" class="input"/><rect x="177" y="750" width="34" height="34" class="input"/><rect x="223" y="750" width="34" height="34" class="input"/><rect x="269" y="750" width="34" height="34" class="input"/><rect x="315" y="750" width="34" height="34" class="input"/><rect x="361" y="750" width="34" height="34" class="input"/><rect x="407" y="750" width="34" height="34" class="input"/></g><rect x="120" y="806" width="90" height="31" rx="5" class="input"/><text x="230" y="827" font-size="13" class="muted">decimal ID</text></g>
<g transform="translate(890 0)"><text x="78" y="700" font-size="13" text-anchor="start">SIGNAL C</text><g font-size="18"><text x="102" y="735">0</text><text x="148" y="735">0</text><text x="194" y="735">1</text><text x="240" y="735">1</text><text x="286" y="735">1</text><text x="332" y="735">1</text><text x="378" y="735">0</text><text x="424" y="735">0</text></g><g><rect x="85" y="750" width="34" height="34" class="input"/><rect x="131" y="750" width="34" height="34" class="input"/><rect x="177" y="750" width="34" height="34" class="input"/><rect x="223" y="750" width="34" height="34" class="input"/><rect x="269" y="750" width="34" height="34" class="input"/><rect x="315" y="750" width="34" height="34" class="input"/><rect x="361" y="750" width="34" height="34" class="input"/><rect x="407" y="750" width="34" height="34" class="input"/></g><rect x="120" y="806" width="90" height="31" rx="5" class="input"/><text x="230" y="827" font-size="13" class="muted">decimal ID</text></g></g>
</svg>
