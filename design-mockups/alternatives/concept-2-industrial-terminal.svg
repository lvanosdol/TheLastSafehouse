<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<title>Rugged Workshop terminal concept</title><desc>An in-world industrial terminal with amber CRT, binary cards, device tabs, and physical controls.</desc>
