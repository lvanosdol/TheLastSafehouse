  <g class="mono" font-size="14" text-anchor="end" fill="#4f6d7f"><text x="838" y="307">1</text><text x="838" y="331">2</text><text x="838" y="355">3</text><text x="838" y="379">4</text><text x="838" y="403">5</text><text x="838" y="427">6</text><text x="838" y="451">7</text><text x="838" y="475">8</text><text x="838" y="499">9</text><text x="838" y="523">10</text><text x="838" y="547">11</text><text x="838" y="571">12</text><text x="838" y="595">13</text><text x="838" y="619">14</text><text x="838" y="643">15</text></g>
  <g class="code"><text x="858" y="307"><tspan fill="#c792ea">LOCATION</tspan> = <tspan fill="#ecc48d">"Workshop"</tspan></text><text x="858" y="331"><tspan fill="#c792ea">LOW_BATTERY_LIMIT</tspan> = <tspan fill="#f78c6c">20</tspan></text><text x="858" y="355">monitor_online = <tspan fill="#82aaff">True</tspan></text><text x="858" y="379">battery_readings = [<tspan fill="#f78c6c">60, 20, 15, 55</tspan>]</text><text x="858" y="427"><tspan fill="#82aaff">def</tspan> <tspan fill="#62e7bd">get_battery_status</tspan>(reading):</text><text x="858" y="451">    <tspan fill="#82aaff">if</tspan> reading <tspan fill="#62d9ff">&lt;=</tspan> LOW_BATTERY_LIMIT:</text><text x="858" y="475">        status = <tspan fill="#ecc48d">"WARNING"</tspan></text><text x="858" y="499">    <tspan fill="#82aaff">else</tspan>:</text><text x="858" y="523">        status = <tspan fill="#ecc48d">"OK"</tspan></text><text x="858" y="571"><tspan fill="#82aaff">for</tspan> reading <tspan fill="#82aaff">in</tspan> battery_readings:</text><text x="858" y="595">    result = get_battery_status(reading)</text><text x="858" y="619">    <tspan fill="#62e7bd">print</tspan>(<tspan fill="#ecc48d">"Battery:"</tspan>, reading, <tspan fill="#ecc48d">"% -"</tspan>, result)</text></g>
  <rect x="851" y="534" width="658" height="27" rx="3" fill="#182b20"/><text x="870" y="553" class="mono green" font-size="16">+       return status</text><rect x="1015" y="543" width="2" height="17" fill="#62e7bd"/>
