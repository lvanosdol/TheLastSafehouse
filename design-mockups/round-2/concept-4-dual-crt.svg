<g transform="translate(0 288)"><rect x="88" y="222" width="522" height="131" rx="5" fill="#15231a" stroke="#3c523e"/><text x="105" y="247" class="tiny">SIGNAL C</text><g font-size="20" text-anchor="middle"><text x="123" y="280">0</text><text x="165" y="280">0</text><text x="207" y="280">1</text><text x="249" y="280">1</text><text x="291" y="280">1</text><text x="333" y="280">1</text><text x="375" y="280">0</text><text x="417" y="280">0</text></g><use href="#fields" x="108" y="296"/><text x="470" y="286" class="tiny">DEC</text><rect x="455" y="301" width="74" height="30" class="slot"/><text x="461" y="345" class="tiny dim">SELECT WORD ↓</text></g>
<text x="92" y="675" class="tiny dim">BIT REFERENCE</text><text x="92" y="703" class="dim" font-size="14">128 64 32 16 8 4 2 1</text>
<rect x="685" y="105" width="670" height="650" rx="28" fill="#202820" stroke="#68715e" stroke-width="3"/><rect x="707" y="128" width="626" height="600" rx="25" class="crt"/><text x="735" y="170" class="tiny green">CRT-B // RECOVERY PROGRAM</text><text x="1170" y="170" class="tiny dim">PY-SIM</text><path d="M735 190h570" stroke="#3e5540"/>
<g font-size="17"><text x="742" y="225">LIMIT = 20</text><text x="742" y="256">READINGS = [60, 20, 15, 55]</text><text x="742" y="306" class="green">DEF battery_status(reading):</text><text x="742" y="337">  IF reading &lt;= LIMIT:</text><text x="742" y="368">    RETURN "WARNING"</text><text x="742" y="399">  RETURN "OK"</text><text x="742" y="450" class="green">FOR reading IN readings:</text><text x="742" y="481">  PRINT reading, battery_status(reading)</text></g>
<rect x="735" y="521" width="570" height="92" fill="#0b1510" stroke="#3c523e"/><text x="752" y="549" class="tiny dim">OUTPUT BUFFER</text><text x="752" y="580" class="dim" font-size="14">Ready. Four verification tests loaded_</text><rect x="735" y="643" width="341" height="55" class="slot"/><text x="753" y="676" font-size="15">TEST STATUS: 0 / 4</text><rect x="1100" y="631" width="205" height="78" rx="6" fill="#735e2e" stroke="#e3c36d" stroke-width="3"/><text x="1202" y="679" text-anchor="middle" font-size="24" class="amber">RUN [▶]</text>
