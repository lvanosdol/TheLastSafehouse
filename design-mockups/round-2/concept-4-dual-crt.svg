<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<title>Dual-screen diagnostic console</title><defs><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#454b43"/><stop offset="1" stop-color="#282e29"/></linearGradient><style>text{font-family:Consolas,monospace;fill:#e8d59b}.dim{fill:#8e987f}.amber{fill:#ffd681}.green{fill:#a9e6ad}.tiny{font-size:12px;letter-spacing:1.8px}.screw{fill:#171c18;stroke:#79806d}.crt{fill:#101b16;stroke:#69715c;stroke-width:4}.slot{fill:#17241b;stroke:#7e7957;stroke-width:1.5}</style><g id="fields"><rect width="31" height="28" class="slot"/><rect x="42" width="31" height="28" class="slot"/><rect x="84" width="31" height="28" class="slot"/><rect x="126" width="31" height="28" class="slot"/><rect x="168" width="31" height="28" class="slot"/><rect x="210" width="31" height="28" class="slot"/><rect x="252" width="31" height="28" class="slot"/><rect x="294" width="31" height="28" class="slot"/></g></defs>
<rect width="1400" height="900" fill="#151a16"/><rect x="18" y="18" width="1364" height="864" rx="22" fill="url(#metal)" stroke="#747b6b" stroke-width="3"/><g class="screw"><circle cx="40" cy="40" r="7"/><circle cx="1360" cy="40" r="7"/><circle cx="40" cy="860" r="7"/><circle cx="1360" cy="860" r="7"/></g><text x="60" y="62" class="tiny">S7 // DUAL DIAGNOSTIC CONSOLE</text><text x="1010" y="62" class="tiny amber">AUXILIARY POWER ONLY</text><path d="M45 84h1310" stroke="#1d241f" stroke-width="3"/>
