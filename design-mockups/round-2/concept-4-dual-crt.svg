<g><rect x="88" y="222" width="522" height="131" rx="5" fill="#15231a" stroke="#3c523e"/><text x="105" y="247" class="tiny">SIGNAL A</text><g font-size="20" text-anchor="middle"><text x="123" y="280">0</text><text x="165" y="280">0</text><text x="207" y="280">1</text><text x="249" y="280">0</text><text x="291" y="280">0</text><text x="333" y="280">1</text><text x="375" y="280">0</text><text x="417" y="280">1</text></g><use href="#fields" x="108" y="296"/><text x="470" y="286" class="tiny">DEC</text><rect x="455" y="301" width="74" height="30" class="slot"/><text x="461" y="345" class="tiny dim">SELECT WORD ↓</text></g>
