<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<title>Portable field repair terminal</title><desc>A rugged ochre portable terminal with a wide LCD, integrated binary decoder, keyboard and physical controls.</desc>
<defs><linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a18a4f"/><stop offset="1" stop-color="#675932"/></linearGradient><style>text{font-family:Consolas,monospace;fill:#ffe0a0}.tiny{font-size:12px;letter-spacing:1.7px}.dim{fill:#a89971}.lcd{fill:#191e17;stroke:#443f27;stroke-width:3}.key{fill:#34372e;stroke:#777052}.inp{fill:#20261c;stroke:#a68c4d}.paper{fill:#ddd3a5}</style><g id="mini"><rect width="29" height="27" class="inp"/><rect x="38" width="29" height="27" class="inp"/><rect x="76" width="29" height="27" class="inp"/><rect x="114" width="29" height="27" class="inp"/><rect x="152" width="29" height="27" class="inp"/><rect x="190" width="29" height="27" class="inp"/><rect x="228" width="29" height="27" class="inp"/><rect x="266" width="29" height="27" class="inp"/></g></defs>
<rect width="1400" height="900" fill="#171914"/><path d="M515 55V24h370v31" fill="none" stroke="#57503a" stroke-width="22"/><path d="M530 50V34h340v16" fill="none" stroke="#171914" stroke-width="9"/>
<rect x="35" y="55" width="1330" height="793" rx="38" fill="url(#case)" stroke="#c0aa66" stroke-width="4"/><path d="M63 101h1274" stroke="#4f472c" stroke-width="3"/><text x="80" y="86" class="tiny" fill="#292b21">SAFEHOUSE FIELD SYSTEMS // UNIT 07</text><text x="1080" y="86" class="tiny" fill="#292b21">RECOVERY MODE</text>
<rect x="70" y="122" width="1260" height="540" rx="17" fill="#30342a" stroke="#4d4c35" stroke-width="4"/><rect x="92" y="144" width="1216" height="494" rx="9" class="lcd"/>
<path d="M780 165v448" stroke="#575237" stroke-width="2"/><text x="120" y="178" class="tiny">MONITOR_RECOVERY.PY</text><text x="810" y="178" class="tiny">BINARY SIGNAL MODULE</text>
<g font-size="17"><text x="122" y="220">LIMIT = 20</text><text x="122" y="252">READINGS = [60, 20, 15, 55]</text><text x="122" y="302">DEF battery_status(reading):</text><text x="122" y="334">  IF reading &lt;= LIMIT:</text><text x="122" y="366">    RETURN "WARNING"</text><text x="122" y="398">  RETURN "OK"</text><text x="122" y="449">FOR reading IN readings:</text><text x="122" y="481">  PRINT reading, battery_status(reading)</text></g>
<rect x="119" y="520" width="620" height="88" fill="#10150f" stroke="#4d4b30"/><text x="139" y="548" class="tiny dim">OPERATOR OUTPUT</text><text x="139" y="579" class="dim" font-size="15">Waiting for execution. Tests loaded: 4_</text>
