<g transform="translate(0 220)"><text x="812" y="217" class="tiny">C</text><g font-size="19" text-anchor="middle"><text x="860" y="217">0</text><text x="898" y="217">0</text><text x="936" y="217">1</text><text x="974" y="217">1</text><text x="1012" y="217">1</text><text x="1050" y="217">1</text><text x="1088" y="217">0</text><text x="1126" y="217">0</text></g><use href="#mini" x="846" y="231"/><rect x="1180" y="231" width="91" height="27" class="inp"/><text x="1180" y="217" class="tiny dim">DECIMAL</text></g>
