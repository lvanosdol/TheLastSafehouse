<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safehouse 7 — simulated computer</title>
  <style>
:root {
  --bg: #0d1a2b;
  --surface: #101d30;
  --surface-2: #16263c;
  --ink: #eaf1fb;
  --ink-dim: #b8c6da;
  --line: #34486a;
  --focus: #ffd166;
  --ok: #9fe0b0;
  --danger: #ff9a9a;
}

* { box-sizing: border-box; }

html {
  font: 100% / 1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
}

body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }

.skip-link {
  position: absolute; left: 0.5rem; top: -3rem;
  background: var(--surface-2); color: var(--ink); padding: 0.5rem 0.75rem;
  border: 2px solid var(--focus); z-index: 50;
}
.skip-link:focus { top: 0.5rem; }

.topbar {
  display: flex; gap: 1rem; align-items: center; justify-content: space-between;
  padding: 0.5rem 1rem; background: #0a1626; border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.simulation-flag { margin: 0; font-size: 0.95rem; color: var(--ink-dim); }

.text-size { display: flex; align-items: center; gap: 0.5rem; }

.last-announcement {
  margin: 0; padding: 0.4rem 1rem; font-size: 0.85rem;
  color: var(--ink-dim); border-top: 1px solid var(--line); background: #0a1626;
}
.text-size button {
  font: inherit; padding: 0.25rem 0.6rem; min-width: 2.5rem;
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
}

#desktop { position: relative; flex: 1; padding: 1.5rem; }

.desktop-title { font-size: 1.1rem; font-weight: 600; margin: 0 0 1rem; color: var(--ink-dim); }

.icons { list-style: none; margin: 0; padding: 0; display: flex; gap: 0.75rem; flex-wrap: wrap; max-width: 24rem; }
.icons button {
  font: inherit; width: 9rem; min-height: 6rem; padding: 0.75rem 0.5rem;
  display: flex; flex-direction: column; gap: 0.5rem; align-items: center; justify-content: center;
  background: transparent; color: var(--ink); border: 1px solid transparent; border-radius: 6px;
  cursor: pointer; text-align: center;
}
.icons button:hover { background: rgba(127, 178, 255, 0.12); }
.icons .glyph { font-size: 2rem; line-height: 1; }

.windows { position: absolute; inset: 5.5rem 1.5rem 1rem auto; display: flex; flex-direction: column; gap: 1rem; align-items: flex-end; pointer-events: none; }
.windows > * { pointer-events: auto; }

.window {
  width: min(38rem, 92vw); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
}
.window-titlebar {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: 0.5rem 0.75rem; background: #1d3350; border-bottom: 1px solid var(--line);
}
.window-titlebar h2 { font-size: 1rem; margin: 0; }
.window-titlebar button {
  font: inherit; padding: 0.2rem 0.55rem; background: transparent; color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
}
.window-body { padding: 1rem; max-height: 60vh; overflow: auto; }

.taskbar {
  display: flex; align-items: center; gap: 1rem; padding: 0.5rem 1rem;
  background: #0a1626; border-top: 1px solid var(--line);
}
.taskbar-label { color: var(--ink-dim); font-size: 0.9rem; }
.taskbar-windows { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.taskbar-windows button {
  font: inherit; padding: 0.3rem 0.7rem; background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
}

@media (max-width: 38rem) {
  .windows { position: static; align-items: stretch; margin-top: 1rem; }
  .window { width: 100%; }
  .icons button { width: 7.5rem; }
}

.path { font-family: ui-monospace, Consolas, monospace; color: var(--ink-dim); margin: 0 0 0.75rem; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 26rem; }
caption { text-align: left; padding-bottom: 0.5rem; color: var(--ink-dim); }
th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--line); }
th { font-weight: 600; background: var(--surface-2); }
tbody tr:focus-within { background: rgba(127, 178, 255, 0.12); }

.row-button {
  font: inherit; padding: 0.15rem 0.4rem; background: transparent; color: var(--ink);
  border: 1px solid transparent; border-radius: 4px; cursor: pointer; text-align: left;
}
.row-button:hover { border-color: var(--line); }

.terminal-output {
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  background: #06101c; border: 1px solid var(--line);
  padding: 0.75rem; margin: 0 0 0.75rem; min-height: 8rem; white-space: pre-wrap;
}
.terminal-form { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.terminal-form label { font-family: ui-monospace, Consolas, monospace; }
.terminal-form input {
  font: inherit; font-family: ui-monospace, Consolas, monospace;
  flex: 1; min-width: 12rem; padding: 0.4rem 0.5rem;
  background: #06101c; color: var(--ink); border: 1px solid var(--line); border-radius: 4px;
}

button:focus-visible, input:focus-visible, [tabindex]:focus-visible, a:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px;
}

.dialog-scrim {
  position: fixed; inset: 0; background: rgba(4, 10, 18, 0.72);
  display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 40;
}
.dialog {
  width: min(34rem, 96vw); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
}
.dialog-body { padding: 1rem 1.25rem; }
.dialog-actions {
  display: flex; gap: 0.5rem; justify-content: flex-end;
  padding: 0.75rem 1.25rem 1.25rem; flex-wrap: wrap;
}
.dialog-actions button {
  font: inherit; padding: 0.4rem 0.9rem; background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
}

.worker-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
.worker-actions button {
  font: inherit; padding: 0.35rem 0.8rem; background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
}
.path-inline { font-family: ui-monospace, Consolas, monospace; }

.status-ok { color: var(--ok); }
.status-error { color: var(--danger); }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

@media (prefers-contrast: more) {
  :root {
    --bg: #000;
    --surface: #000;
    --surface-2: #141414;
    --ink: #fff;
    --ink-dim: #f2f2f2;
    --line: #fff;
    --focus: #ffff00;
    --ok: #b6f7c1;
    --danger: #ffb3b3;
  }
  .topbar, .taskbar, .last-announcement, .window, .dialog, .terminal-output, table th, table td {
    border-color: var(--line);
  }
}

@media (forced-colors: active) {
  .window, .dialog, .terminal-output { border: 1px solid CanvasText; }
}

  </style>
</head>
<body>
  <a class="skip-link" href="#desktop">Skip to desktop</a>

  <header class="topbar">
    <p class="simulation-flag" id="simulation-flag">
      <span aria-hidden="true">◉</span> Simulated computer — nothing here affects your device
    </p>
    <div class="text-size" role="group" aria-label="Text size">
      <button type="button" id="test-announce">Test announcement</button>
      <button type="button" id="text-smaller" aria-describedby="text-size-status">A−</button>
      <button type="button" id="text-larger" aria-describedby="text-size-status">A+</button>
      <span id="text-size-status" class="sr-only">Text size: 100 percent</span>
    </div>
  </header>

  <main id="desktop" tabindex="-1" aria-label="Simulated desktop">
    <h1 class="desktop-title">Safehouse 7 — Workshop computer</h1>
    <ul class="icons" id="desktop-icons"></ul>
    <div id="windows" class="windows" aria-label="Open windows"></div>
  </main>

  <footer class="taskbar">
    <span class="taskbar-label">Windows</span>
    <div id="taskbar-windows" class="taskbar-windows" role="group" aria-label="Open windows"></div>
  </footer>

  <p class="last-announcement" aria-hidden="true">
    Last announcement: <span id="last-announcement">none yet</span>
  </p>
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="alert-announcer" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <script>
// ---- scripts/data.js ----
// Simulated file system for the Chapter 1 slice.
// Paths are fictional but shaped like real Windows paths.

const COMPUTER = 'This PC';
const ROOT = 'C:\\Safehouse7';

const ACCOUNTS = [
  { id: 'recovery', label: 'SAFEHOUSE7\\recovery', note: 'Delegated recovery role' },
  { id: 'mvale', label: 'SAFEHOUSE7\\M.VALE', note: 'Delegated maintenance role' },
  { id: 'admins', label: 'SAFEHOUSE7\\Administrators', note: 'Administrator identity is held elsewhere' },
];

const tree = {
  [ROOT]: {
    type: 'folder',
    children: ['Practice'],
    modified: '2026-11-24 08:12',
  },
  [ROOT + '\\Practice']: {
    type: 'folder',
    children: ['Logs', 'Evidence', 'Recovery', 'Settings'],
    modified: '2026-11-24 08:12',
  },
  [ROOT + '\\Practice\\Logs']: {
    type: 'folder',
    children: ['sensor.log', 'power.log', 'display.log'],
    modified: '2026-11-24 07:58',
  },
  [ROOT + '\\Practice\\Evidence']: {
    type: 'folder',
    children: [],
    modified: '2026-11-24 08:05',
  },
  [ROOT + '\\Practice\\Recovery']: {
    type: 'folder',
    children: ['practice.cfg'],
    modified: '2026-11-20 21:40',
  },
  [ROOT + '\\Practice\\Settings']: {
    type: 'folder',
    children: [],
    modified: '2026-11-20 21:40',
  },
  [ROOT + '\\Practice\\Logs\\sensor.log']: {
    type: 'file',
    size: '4 KB',
    modified: '2026-11-24 07:58',
    readOnly: false,
  },
  [ROOT + '\\Practice\\Logs\\power.log']: {
    type: 'file',
    size: '2 KB',
    modified: '2026-11-24 07:44',
    readOnly: false,
  },
  [ROOT + '\\Practice\\Logs\\display.log']: {
    type: 'file',
    size: '3 KB',
    modified: '2026-11-24 07:51',
    readOnly: false,
  },
  [ROOT + '\\Practice\\Recovery\\practice.cfg']: {
    type: 'file',
    size: '1 KB',
    modified: '2026-11-20 21:40',
    readOnly: true,
    security: {
      recovery: { read: 'Allow', write: 'Deny' },
      mvale: { read: 'Allow', write: 'Allow' },
      admins: { read: 'Allow', write: 'Allow' },
    },
  },
};

const DESKTOP_ICONS = [
  { label: 'Practice', path: ROOT + '\\Practice' },
  { label: 'Recovery', path: ROOT + '\\Practice\\Recovery' },
];

function list(path) {
  const item = tree[path];
  if (!item || item.type !== 'folder') return [];
  return item.children.map((name) => {
    const childPath = path + '\\' + name;
    const child = tree[childPath] || {};
    return {
      name,
      path: childPath,
      type: child.type || 'file',
      size: child.size || '',
      modified: child.modified || '',
      readOnly: Boolean(child.readOnly),
    };
  });
}

function entry(path) {
  return tree[path];
}

function shortName(path) {
  const parts = path.split('\\');
  return parts[parts.length - 1];
}

// ---- scripts/a11y.js ----
const polite = document.getElementById('announcer');
const assertive = document.getElementById('alert-announcer');
const mirror = document.getElementById('last-announcement');

/** Announce a change to screen readers. Errors use the assertive region. */
function announce(message, { urgent = false } = {}) {
  const region = urgent ? assertive : polite;
  region.textContent = '';
  // A tick lets repeated identical messages be announced again.
  window.setTimeout(() => {
    region.textContent = message;
  }, 30);
  // Visible mirror so a sighted tester can tell whether the app spoke at all.
  if (mirror) mirror.textContent = (urgent ? 'ERROR: ' : '') + message;
}

const FOCUSABLE = [
  'a[href]',
  'button:not([disabled])',
  'input:not([disabled])',
  'select:not([disabled])',
  'textarea:not([disabled])',
  '[tabindex]:not([tabindex="-1"])',
].join(',');

function focusables(container) {
  return Array.from(container.querySelectorAll(FOCUSABLE)).filter(
    (el) => el.offsetParent !== null || el === document.activeElement
  );
}

/** Open a modal dialog, trap focus inside it, and restore focus on close. */
function openModal({ title, body, actions = [], onClose }) {
  const opener = document.activeElement;
  const scrim = document.createElement('div');
  scrim.className = 'dialog-scrim';

  const dialog = document.createElement('div');
  dialog.className = 'dialog';
  dialog.setAttribute('role', 'dialog');
  dialog.setAttribute('aria-modal', 'true');
  dialog.setAttribute('tabindex', '-1');

  const headingId = 'dialog-title-' + Math.random().toString(36).slice(2, 8);
  dialog.setAttribute('aria-labelledby', headingId);

  const header = document.createElement('div');
  header.className = 'window-titlebar';
  header.innerHTML = '<h2 id="' + headingId + '"></h2>';
  header.querySelector('h2').textContent = title;

  const bodyEl = document.createElement('div');
  bodyEl.className = 'dialog-body';
  if (typeof body === 'string') bodyEl.innerHTML = body;
  else bodyEl.appendChild(body);

  const actionBar = document.createElement('div');
  actionBar.className = 'dialog-actions';

  const close = () => {
    scrim.remove();
    if (opener && typeof opener.focus === 'function') opener.focus();
    if (onClose) onClose();
    announce(title + ' closed.');
  };

  actions.forEach((action) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = action.label;
    button.addEventListener('click', () => {
      if (action.onClick) action.onClick({ close });
      else close();
    });
    actionBar.appendChild(button);
  });

  if (!actions.some((a) => a.label === 'Close')) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = 'Close';
    button.addEventListener('click', () => close());
    actionBar.appendChild(button);
  }

  dialog.append(header, bodyEl, actionBar);
  scrim.appendChild(dialog);
  document.body.appendChild(scrim);

  scrim.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      event.preventDefault();
      close();
      return;
    }
    if (event.key !== 'Tab') return;
    const items = focusables(dialog);
    if (items.length === 0) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });

  const items = focusables(dialog);
  (items[0] || dialog).focus();

  return { dialog, close };
}

// ---- scripts/window-manager.js ----
const windowsEl = document.getElementById('windows');
const taskbarEl = document.getElementById('taskbar-windows');
const open = new Map();

/** Open (or focus) a window. render(bodyElement) fills the window body. */
function openWindow({ id, title, render }) {
  if (open.has(id)) {
    const existing = open.get(id);
    existing.heading.focus();
    announce(title + ' brought to the front.');
    return existing;
  }

  const section = document.createElement('section');
  section.className = 'window';
  section.setAttribute('aria-labelledby', 'win-title-' + id);

  const bar = document.createElement('div');
  bar.className = 'window-titlebar';

  const heading = document.createElement('h2');
  heading.id = 'win-title-' + id;
  heading.tabIndex = -1;
  heading.textContent = title;

  const closeButton = document.createElement('button');
  closeButton.type = 'button';
  closeButton.textContent = 'Close';
  closeButton.setAttribute('aria-label', 'Close ' + title);

  bar.append(heading, closeButton);

  const body = document.createElement('div');
  body.className = 'window-body';
  render(body);

  section.append(bar, body);
  windowsEl.appendChild(section);

  const taskButton = document.createElement('button');
  taskButton.type = 'button';
  taskButton.textContent = title;
  taskButton.addEventListener('click', () => heading.focus());
  taskbarEl.appendChild(taskButton);

  const record = { section, heading, closeButton, taskButton, id };
  open.set(id, record);

  const close = () => {
    section.remove();
    taskButton.remove();
    open.delete(id);
    announce(title + ' closed.');
    const next = Array.from(open.values()).pop();
    if (next) next.heading.focus();
  };

  closeButton.addEventListener('click', close);
  heading.focus();
  announce(title + ' opened.');

  return record;
}

function closeWindow(id) {
  const record = open.get(id);
  if (record) record.closeButton.click();
}

function openCount() {
  return open.size;
}

// ---- scripts/apps/properties.js ----
function showSecurity(path) {
  const file = entry(path) || {};
  const name = shortName(path);
  const title = name + ' — Properties';

  const wrap = document.createElement('div');
  const intro = document.createElement('p');

  // Only the recovery file carries per-file permissions in this slice. Any
  // other file says so plainly rather than showing a table of "Not listed"
  // under the wrong file name.
  if (!file.security) {
    intro.textContent =
      'Permissions for ' +
      name +
      '. This simulated file has no permissions of its own; it inherits its folder permissions, which this exercise does not model.';
    wrap.appendChild(intro);

    openModal({ title, body: wrap, actions: [{ label: 'Close' }] });
    announce('Properties opened for ' + name + '. No per-file permissions are simulated for this file.');
    return;
  }

  const security = file.security;

  intro.textContent =
    'Permissions for ' + name + '. Read-only in this exercise: the recovery role cannot change them.';
  wrap.appendChild(intro);

  const tableWrap = document.createElement('div');
  tableWrap.className = 'table-wrap';
  const table = document.createElement('table');
  table.innerHTML =
    '<caption>Security tab — effective permissions</caption>' +
    '<thead><tr><th scope="col">Account</th><th scope="col">Read</th><th scope="col">Write</th><th scope="col">Role note</th></tr></thead>';
  const tbody = document.createElement('tbody');

  ACCOUNTS.forEach((account) => {
    const rights = security[account.id] || { read: 'Not listed', write: 'Not listed' };
    const row = document.createElement('tr');
    const cells = [account.label, rights.read, rights.write, account.note];
    cells.forEach((value, index) => {
      const cell = document.createElement(index === 0 ? 'th' : 'td');
      if (index === 0) cell.setAttribute('scope', 'row');
      cell.textContent = value;
      row.appendChild(cell);
    });
    tbody.appendChild(row);
  });

  table.appendChild(tbody);
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);

  const note = document.createElement('p');
  note.className = 'status-ok';
  note.textContent = 'Your account can read this file. It cannot write to it, and that is expected.';
  wrap.appendChild(note);

  openModal({
    title,
    body: wrap,
    actions: [{ label: 'Close' }],
  });

  announce(
    'Properties opened for ' + name + '. Security tab. Read allowed, write denied for the recovery role.'
  );
}

function showDenial(path, action) {
  const wrap = document.createElement('div');
  const first = document.createElement('p');
  first.innerHTML =
    '<strong>Permission denied.</strong> You can read <span class="path-inline"></span>, but you cannot ' +
    action +
    ' it.';
  first.querySelector('.path-inline').textContent = shortName(path);

  const second = document.createElement('p');
  second.textContent =
    'A denial does not mean the file is damaged, encrypted, or unusable. It means your account does not have that permission.';

  wrap.append(first, second);

  openModal({
    title: 'Permission denied',
    body: wrap,
    actions: [{ label: 'Close' }],
  });

  announce('Permission denied. The file is readable but cannot be changed.', { urgent: true });
}

// ---- scripts/apps/files.js ----
function explorerBody(container, startPath) {
  let current = startPath;
  let selected = null;

  function openFolder(path) {
    current = path;
    selected = null;
    render();
    announce('Opened ' + path + '. ' + list(path).length + ' items.');
  }

  function selectFile(file) {
    selected = file;
    render();
    announce(
      'Selected ' + file.name + '. ' + file.size + '. Modified ' + file.modified + '. Read-only: ' +
        (file.readOnly ? 'yes' : 'no') + '.'
    );
  }

  function render() {
    container.innerHTML = '';

    const pathLine = document.createElement('p');
    pathLine.className = 'path';
    pathLine.textContent = current;

    const toolbar = document.createElement('div');
    toolbar.className = 'terminal-form';
    const up = document.createElement('button');
    up.type = 'button';
    up.textContent = 'Up one level';
    up.disabled = current === ROOT;
    up.addEventListener('click', () => {
      const parent = current.slice(0, current.lastIndexOf('\\'));
      if (parent) openFolder(parent);
    });
    toolbar.appendChild(up);

    const tableWrap = document.createElement('div');
    tableWrap.className = 'table-wrap';
    const table = document.createElement('table');
    const caption = document.createElement('caption');
    caption.textContent = 'Contents of ' + shortName(current);
    table.appendChild(caption);

    const thead = document.createElement('thead');
    thead.innerHTML =
      '<tr><th scope="col">Name</th><th scope="col">Type</th><th scope="col">Size</th>' +
      '<th scope="col">Date modified</th><th scope="col">Read-only</th></tr>';
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    const rows = list(current);

    if (rows.length === 0) {
      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.colSpan = 5;
      cell.textContent = 'This folder is empty.';
      row.appendChild(cell);
      tbody.appendChild(row);
    }

    rows.forEach((item) => {
      const row = document.createElement('tr');
      row.dataset.path = item.path;

      const nameCell = document.createElement('td');
      const nameButton = document.createElement('button');
      nameButton.type = 'button';
      nameButton.className = 'row-button';
      nameButton.textContent = item.name;
      nameButton.addEventListener('click', () => {
        if (item.type === 'folder') openFolder(item.path);
        else selectFile(item);
      });
      nameCell.appendChild(nameButton);

      const values = [
        item.type === 'folder' ? 'File folder' : 'Log file',
        item.size || '',
        item.modified,
        item.type === 'folder' ? '' : item.readOnly ? 'Yes' : 'No',
      ];

      row.appendChild(nameCell);
      values.forEach((value) => {
        const cell = document.createElement('td');
        cell.textContent = value;
        row.appendChild(cell);
      });

      if (selected && selected.path === item.path) row.setAttribute('aria-current', 'true');
      tbody.appendChild(row);
    });

    table.appendChild(tbody);
    tableWrap.appendChild(table);

    const details = document.createElement('div');
    details.setAttribute('role', 'group');
    details.setAttribute('aria-label', 'Selected item');

    if (selected) {
      const summary = document.createElement('p');
      summary.textContent =
        'Selected: ' + selected.name + '. Size ' + selected.size + '. Modified ' +
        selected.modified + '. Read-only: ' + (selected.readOnly ? 'yes' : 'no') + '.';

      const actions = document.createElement('div');
      actions.className = 'worker-actions';

      const perms = document.createElement('button');
      perms.type = 'button';
      perms.textContent = 'View permissions';
      perms.addEventListener('click', () => showSecurity(selected.path));

      const edit = document.createElement('button');
      edit.type = 'button';
      edit.textContent = selected.readOnly ? 'Try to edit this file' : 'Open a copy';
      edit.addEventListener('click', () => {
        if (selected.readOnly) showDenial(selected.path, 'change or remove');
        else announce('Copy opened in the simulated editor. The original is unchanged.');
      });

      actions.append(perms, edit);
      details.append(summary, actions);
    } else {
      const hint = document.createElement('p');
      hint.textContent = 'Select a file to see its details, or open a folder.';
      details.appendChild(hint);
    }

    container.append(pathLine, toolbar, tableWrap, details);
  }

  render();
}

// ---- scripts/apps/terminal.js ----
const COMMANDS = ['dir', 'whoami', 'help', 'cls'];

function dirOutput(path) {
  const rows = list(path);
  const header = ' Directory of ' + path + '\n\n';
  if (rows.length === 0) return header + '(no items)\n';
  return (
    header +
    rows
      .map((row) => {
        const kind = row.type === 'folder' ? '<DIR>' : '     ';
        return kind + '  ' + row.modified + '  ' + row.name;
      })
      .join('\n') +
    '\n'
  );
}

function terminalBody(container) {
  const output = document.createElement('pre');
  output.className = 'terminal-output';
  output.setAttribute('role', 'log');
  output.setAttribute('aria-label', 'Terminal output');
  output.textContent =
    'Safehouse 7 simulated terminal\nType help for available commands.\n\n';

  const form = document.createElement('form');
  form.className = 'terminal-form';

  const label = document.createElement('label');
  label.htmlFor = 'terminal-input';
  label.textContent = 'C:\\Safehouse7>';

  const input = document.createElement('input');
  input.id = 'terminal-input';
  input.name = 'command';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.setAttribute('aria-describedby', 'terminal-hint');

  const hint = document.createElement('p');
  hint.id = 'terminal-hint';
  hint.className = 'sr-only';
  hint.textContent = 'Available commands: dir, whoami, help, cls.';

  const submit = document.createElement('button');
  submit.type = 'submit';
  submit.textContent = 'Run';

  form.append(label, input, submit);

  let cwd = ROOT;

  function write(text) {
    output.textContent += text;
    output.scrollTop = output.scrollHeight;
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const raw = input.value.trim();
    if (!raw) return;
    const command = raw.toLowerCase();
    write('C:\\Safehouse7> ' + raw + '\n');

    if (command === 'help') {
      write('Available commands: dir, whoami, help, cls.\n\n');
    } else if (command === 'dir') {
      write(dirOutput(cwd));
    } else if (command === 'whoami') {
      write('SAFEHOUSE7\\recovery\n\n');
    } else if (command === 'cls') {
      output.textContent = '';
    } else {
      write(
        'Command not recognized: ' +
          raw +
          '\nAvailable commands: ' +
          COMMANDS.join(', ') +
          '.\n\n'
      );
    }

    input.value = '';
  });

  container.append(output, form, hint);
  input.focus();
}

// ---- scripts/desktop.js ----
const iconList = document.getElementById('desktop-icons');

function iconButton({ label, glyph, onActivate, description }) {
  const li = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  button.innerHTML = '<span class="glyph" aria-hidden="true"></span><span class="name"></span>';
  button.querySelector('.glyph').textContent = glyph;
  button.querySelector('.name').textContent = label;
  if (description) button.setAttribute('aria-describedby', description.id);
  button.addEventListener('click', onActivate);
  li.appendChild(button);
  return li;
}

DESKTOP_ICONS.forEach((icon) => {
  iconList.appendChild(
    iconButton({
      label: icon.label,
      glyph: icon.type === 'folder' ? '▤' : '▥',
      onActivate: () =>
        openWindow({
          id: 'explorer:' + icon.path,
          title: icon.label + ' — File Explorer',
          render: (body) => explorerBody(body, icon.path),
        }),
    })
  );
});

iconList.appendChild(
  iconButton({
    label: 'Terminal',
    glyph: '▶',
    onActivate: () =>
      openWindow({ id: 'terminal', title: 'Terminal', render: terminalBody }),
  })
);

// Text size control
const status = document.getElementById('text-size-status');
let scale = 100;

function setScale(next) {
  scale = Math.min(150, Math.max(87, next));
  document.documentElement.style.fontSize = scale + '%';
  status.textContent = 'Text size: ' + scale + ' percent';
  announce('Text size ' + scale + ' percent.');
}

document.getElementById('text-smaller').addEventListener('click', () => setScale(scale - 12));
document.getElementById('text-larger').addEventListener('click', () => setScale(scale + 12));

document.getElementById('test-announce').addEventListener('click', () => {
  announce(
    'This is a test announcement. If you can hear this, a screen reader is reading the page.'
  );
});

// Announce the simulation once, after the page settles.
window.setTimeout(() => {
  announce(
    'Simulated computer. Nothing you do here affects your real device. Press Tab to reach the desktop.'
  );
}, 600);

document.getElementById('desktop').addEventListener('focus', () => {
  announce('Desktop. ' + DESKTOP_ICONS.length + ' folders and a terminal are available.');
}, { once: true });
